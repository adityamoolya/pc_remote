name: pc_remote_app
description: A Flutter app to control your PC remotely
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  bonsoir: ^6.0.1
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  google_fonts: ^8.0.0
  http: ^1.1.0
  mobile_scanner: ^7.1.4
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  web_socket_channel: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
